name: Export bilingual source snapshot

on:
  push:
    branches: [feature/zh-ja-language-mode]
    paths:
      - '.github/workflows/export-bilingual-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bilingual-source
          path: |
            src/content/daily
            src/content/japanese
            src/pages
            src/layouts
            src/components
            src/lib
            src/styles
            src/content.config.ts
            astro.config.mjs
            package.json
            package-lock.json
          retention-days: 1
