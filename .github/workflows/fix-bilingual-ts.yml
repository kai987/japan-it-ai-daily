name: Fix bilingual TypeScript annotations

on:
  push:
    branches: [feature/zh-ja-language-mode]
    paths:
      - '.github/workflows/fix-bilingual-ts.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Apply parameter annotations
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/pages/ja/japanese.astro'): {
                  'const pageNumbers = (totalPages, page) => {': 'const pageNumbers = (totalPages: number, page: number) => {',
                  'const renderPagination = (filteredRows) => {': 'const renderPagination = (filteredRows: HTMLElement[]) => {',
              },
              Path('src/pages/ja/interview.astro'): {
                  'const pageNumbers = (totalPages, page) => {': 'const pageNumbers = (totalPages: number, page: number) => {',
                  'const renderPagination = (filteredDays) => {': 'const renderPagination = (filteredDays: HTMLElement[]) => {',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/fix-bilingual-ts.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git add src/pages/ja/japanese.astro src/pages/ja/interview.astro .github/workflows/fix-bilingual-ts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: type bilingual pagination scripts'
          git push origin HEAD:feature/zh-ja-language-mode
