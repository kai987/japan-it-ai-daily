name: Capture public originals 2026-09-26
on:
  push:
    branches: [automation/daily-progress]
    paths: [.github/workflows/capture-daily-20260926.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch selected public sources without authentication
        run: |
          mkdir -p /tmp/originals
          python3 <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from pathlib import Path
          from html.parser import HTMLParser
          import json,datetime,hashlib,time
          urls=[
          'https://forest.watch.impress.co.jp/docs/news/2143099.html',
          'https://ai.watch.impress.co.jp/docs/news/2143106.html',
          'https://cloud.watch.impress.co.jp/docs/news/2142958.html',
          'https://forest.watch.impress.co.jp/docs/news/2143091.html',
          'https://www.itmedia.co.jp/enterprise/articles/2609/26/news009.html',
          'https://unity3d.jp/news/build-for-meta-vr-glasses-with-unity/'
          ]
          class Text(HTMLParser):
              def __init__(self): super().__init__();self.parts=[];self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'):self.skip+=1
                  if tag in ('p','div','h1','h2','h3','li','br','section','article'):self.parts.append('\n')
              def handle_endtag(self,tag):
                  if tag in ('script','style'):self.skip=max(0,self.skip-1)
                  if tag in ('p','div','h1','h2','h3','li','section','article'):self.parts.append('\n')
              def handle_data(self,data):
                  if not self.skip:self.parts.append(data)
          result=[]
          for index,url in enumerate(urls,1):
              row={'index':index,'url':url,'attempts':0,'status':'unknown'}
              for attempt in range(1,4):
                  row['attempts']=attempt
                  try:
                      req=Request(url,headers={'User-Agent':'DailyPublicationSourceVerifier/1.0','Accept':'text/html'})
                      with urlopen(req,timeout=40) as response:
                          data=response.read();encoding=response.headers.get_content_charset() or 'utf-8';row['finalUrl']=response.url;row['httpStatus']=response.status
                      html=data.decode(encoding,errors='replace');parser=Text();parser.feed(html)
                      text='\n'.join(x.strip() for x in ''.join(parser.parts).splitlines() if x.strip())+'\n'
                      Path(f'/tmp/originals/{index:02}.html').write_bytes(data)
                      Path(f'/tmp/originals/{index:02}.txt').write_text(text,encoding='utf-8')
                      row.update(status='retrieved',capturedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(),rawSha256=hashlib.sha256(data).hexdigest(),snapshotSha256=hashlib.sha256(text.encode()).hexdigest(),bytes=len(data))
                      break
                  except HTTPError as e:
                      row.update(status='http_error',httpStatus=e.code,error=str(e))
                      if e.code in (401,403) or e.code not in (429,500,502,503,504):break
                  except (URLError,TimeoutError) as e:
                      row.update(status='transport_error',error=str(e))
                  if attempt<3:time.sleep(2**attempt)
              result.append(row)
              print(json.dumps(row,ensure_ascii=False))
          Path('/tmp/originals/capture-report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Retain source captures outside Git
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: originals-20260926
          path: /tmp/originals/
          if-no-files-found: error
          retention-days: 1
