name: Read-only original article capture 2026-09-28
on:
  push:
    branches: [automation/daily-progress]
    paths: [.github/workflows/capture-publication-20260928.yml]
permissions: {}
concurrency:
  group: publication-original-capture-20260928
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture public originals without credentials or Git writes
        run: |
          python3 <<'PY'
          import pathlib, urllib.request, urllib.error, hashlib, json, datetime
          out=pathlib.Path('/tmp/originals-20260928'); out.mkdir()
          urls=[
            'https://dev.classmethod.jp/articles/clm-contrastive-language-model-switchyard-judge/',
            'https://dev.classmethod.jp/articles/slug-aws-cognito-sso-oidc-adminInitiateAuth/',
            'https://dev.classmethod.jp/articles/20260927-aws-startup-advisor/',
            'https://zenn.dev/katsu658/articles/5dc8de146e0964',
            'https://zenn.dev/aynyan/articles/ayn-jarvis-voice-assistant-intro',
            'https://dev.classmethod.jp/articles/kev-oss-jev-compatible-mlx-mac/',
            'https://dev.classmethod.jp/articles/slug-aws-cognito-sso-oidc/'
          ]
          results=[]
          for i,url in enumerate(urls,1):
              record={'id':i,'url':url,'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'IT-Daily-Source-Review/1.0'}),timeout=40) as response:
                      data=response.read(8000001)
                      if len(data)>8000000: raise ValueError('Response exceeds capture bound; incomplete, not reviewed')
                      record.update(status=response.status,finalUrl=response.url,contentType=response.headers.get('Content-Type'),sha256=hashlib.sha256(data).hexdigest(),file=f'{i:02}.html')
                      (out/record['file']).write_bytes(data)
              except Exception as exc:
                  record.update(status=getattr(exc,'code',None),error=str(exc))
              results.append(record)
          (out/'captures.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Retain originals outside Git for human claim verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-originals-20260928
          path: /tmp/originals-20260928/
          if-no-files-found: error
          retention-days: 3
