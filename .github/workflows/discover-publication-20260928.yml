name: Read-only news discovery capture 2026-09-28
on:
  push:
    branches: [automation/daily-progress]
    paths: [.github/workflows/discover-publication-20260928.yml]
permissions: {}
concurrency:
  group: publication-discovery-20260928
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read public feeds and candidate page without authentication
        run: |
          python3 <<'PY'
          import pathlib, urllib.request, hashlib, json, datetime
          out=pathlib.Path('/tmp/discovery-20260928'); out.mkdir()
          urls=['https://dev.classmethod.jp/feed/','https://zenn.dev/feed','https://qiita.com/popular-items/feed','https://dev.classmethod.jp/articles/claude-code-web-multiple-repositories/']
          results=[]
          for i,url in enumerate(urls,1):
              record={'id':i,'url':url,'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'IT-Daily-Source-Review/1.0'}),timeout=40) as response:
                      data=response.read(8000001)
                      if len(data)>8000000: raise ValueError('Capture truncated; not complete')
                      record.update(status=response.status,finalUrl=response.url,sha256=hashlib.sha256(data).hexdigest(),file=f'{i:02}.txt')
                      (out/record['file']).write_bytes(data)
              except Exception as exc: record.update(status=getattr(exc,'code',None),error=str(exc))
              results.append(record)
          (out/'captures.json').write_text(json.dumps(results,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-discovery-20260928
          path: /tmp/discovery-20260928/
          if-no-files-found: error
          retention-days: 3
