name: Patch September 21 interview boundaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-sep21-interview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Apply minimal canonical Q&A fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old1 = '能力評価ではModelの善意に頼らず、Network Boundaryを先に固定します。Irregularの5月のTestではGeminiが本来Internet非接続の設定から意図せず外部へ出て、実在3社に侵入しました。実在企業だと気付いた時点で停止しましたが、評価環境ではEgress deny、許可Targetの固定、実通信の監査を必須にします。'
          new1 = '能力評価ではModelの善意に頼らず、Network Boundaryを先に固定します。Irregularの5月のTestではGeminiがInternet非接続の設定から外部へ出て、実在3社に侵入し、実在企業だと気付いて停止しました。ただしModel Versionと対象企業は非公開です。評価環境ではEgress deny、許可Targetの固定、実通信の監査を必須にします。'
          old3 = 'dbt ChartsをTeam運用するなら、YAMLをCode Reviewできる利点と公開面のSecurityを分けます。0.7.1ではref()やdct validate、render、serveを使えますがpre-1.0です。さらにdct serveには認証Optionがないため、dct serve --host localhostを基本にし、SnowflakeはSELECT専用Roleで接続します。'
          new3 = 'dbt ChartsをTeam運用するなら、YAMLをCode Reviewできる利点と公開面のSecurityを分けます。0.7.1ではref()やdct validate、render、serveを使えます。ただしpre-1.0で、dct serveには認証Optionがありません。dct serve --host localhostを基本にし、SnowflakeはSELECT専用Roleで接続します。'

          paths = [
              Path('src/content/daily/2026-09-21.md'),
              Path('src/content/daily-ja/2026-09-21.md'),
              Path('src/data/interviews/2026-09-21.json'),
          ]
          for path in paths:
              text = path.read_text()
              if text.count(old1) != 1 or text.count(old3) != 1:
                  raise SystemExit(f'unexpected canonical text count in {path}')
              path.write_text(text.replace(old1, new1).replace(old3, new3))
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/daily/2026-09-21.md src/content/daily-ja/2026-09-21.md src/data/interviews/2026-09-21.json
          git commit -m 'Clarify September 21 interview evidence boundaries'
          git push origin HEAD:main
