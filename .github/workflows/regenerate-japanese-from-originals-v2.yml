name: Regenerate Japanese history from originals v2

on:
  push:
    branches: [repair/japanese-history-from-originals]
    paths:
      - '.github/workflows/regenerate-japanese-from-originals-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_DATE: '2026-09-06'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install tools
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          python3 -m pip install --disable-pip-version-check --no-cache-dir pyyaml==6.0.2 requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1

      - name: Prepare source-only context and original article text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-articles
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import requests, yaml
          from bs4 import BeautifulSoup

          date = os.environ['TARGET_DATE']
          def fm(path):
              text = Path(path).read_text(encoding='utf-8')
              end = text.find('\n---\n', 4)
              if not text.startswith('---\n') or end < 0:
                  raise RuntimeError(f'Bad frontmatter: {path}')
              return yaml.safe_load(text[4:end]) or {}

          daily = fm(f'src/content/daily/{date}.md')
          lesson = fm(f'src/content/japanese/{date}.md')
          top = daily.get('top') or []
          if len(top) != 5:
              raise RuntimeError('Top 5 must contain exactly five items')

          context = {
              'date': date,
              'topics': daily.get('topics') or [],
              'sources': daily.get('sources') or [],
              'top': [{
                  'index': i + 1,
                  'title': x.get('title',''),
                  'source': x.get('source',''),
                  'topic': x.get('topic',''),
                  'url': x.get('url',''),
              } for i, x in enumerate(top)],
              'learning': {
                  'topics': lesson.get('topics') or [],
                  'levels': lesson.get('levels') or [],
                  'vocabularyCount': lesson.get('vocabularyCount',0),
                  'grammarCount': lesson.get('grammarCount',0),
                  'vocabulary': [{
                      'term': x.get('term',''), 'reading': x.get('reading',''),
                      'partOfSpeech': x.get('partOfSpeech',''), 'level': x.get('level',''),
                      'collocations': x.get('collocations') or [], 'exampleJa': x.get('exampleJa',''),
                  } for x in (lesson.get('vocabulary') or [])],
                  'grammar': [{
                      'pattern': x.get('pattern',''), 'level': x.get('level',''),
                      'structure': x.get('structure',''), 'exampleJa': x.get('exampleJa',''),
                  } for x in (lesson.get('grammar') or [])],
                  'technicalTerms': [{
                      'term': x.get('term',''),
                      **({'japanese': x.get('japanese')} if x.get('japanese') else {}),
                  } for x in (lesson.get('technicalTerms') or [])],
                  'mustRememberWords': lesson.get('mustRememberWords') or [],
                  'mustRememberGrammar': lesson.get('mustRememberGrammar') or [],
              },
          }
          Path('/tmp/source-context.json').write_text(json.dumps(context, ensure_ascii=False, indent=2), encoding='utf-8')

          headers = {'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept-Language':'ja,en;q=0.8'}
          for idx, item in enumerate(top, 1):
              url = item.get('url') or ''
              path = Path(f'/tmp/original-articles/{idx:02d}.txt')
              try:
                  r = requests.get(url, headers=headers, timeout=30, allow_redirects=True)
                  r.raise_for_status()
                  soup = BeautifulSoup(r.text, 'lxml')
                  for tag in soup(['script','style','noscript','svg','form','nav','footer','header','aside']): tag.decompose()
                  root = soup.find('article') or soup.find('main') or soup.body or soup
                  text = re.sub(r'\n{3,}', '\n\n', root.get_text('\n', strip=True))[:70000]
                  path.write_text(f'URL: {r.url}\nHTTP_STATUS: {r.status_code}\nSOURCE_TITLE: {item.get("title","")}\n\n{text}\n', encoding='utf-8')
                  print(f'{idx}: {r.status_code} {len(text)} chars {r.url}')
              except Exception as e:
                  path.write_text(f'URL: {url}\nFETCH_STATUS: failed\nERROR: {e}\n', encoding='utf-8')
                  print(f'::warning::{idx} fetch failed: {e}')
          PY

      - name: Generate source-direct Japanese sample
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/prompt.txt <<'EOF'
          You are a senior native-level Japanese technical editor. Rebuild these two files for 2026-09-06:
          - src/content/daily-ja/2026-09-06.md
          - src/content/japanese-ja/2026-09-06.md

          SOURCE OF TRUTH ONLY:
          - /tmp/source-context.json: factual Top-5 metadata and Japanese-learning skeleton.
          - /tmp/original-articles/01.txt ... 05.txt: original article text fetched from the URLs.
          Do not translate or use Chinese report prose or Chinese learning explanations. If an original fetch is blocked/incomplete, retry its URL with shell/web retrieval. If it remains inaccessible, stay strictly within the title/source/topic metadata and do not invent details.

          DAILY-JA:
          - Frontmatter keys exactly: title,date,description,topics,sources,top,featured.
          - top has exactly five items; title/source/topic/url must exactly match source-context; write why directly in natural Japanese from original sources.
          - Full publication-quality A+B+C report. Required headings: # A. 詳細版; ## 1. 今日読むべき5本; five ### ①–⑤ article sections; ## 2. カテゴリ別サマリー; ## 3. 面接で使えるポイント; ## 4. 今日の技術テーマ; ## 5. 面接復習カード; # B. 重要ポイントと面接で使える知識; # C. 日本語学習｜JLPT + IT日本語.
          - Each Top-5 section includes 出典, 原文 URL, faithful Japanese technical summary and 注目ポイント.
          - Write idiomatic Japanese directly from original sources. Preserve standard English technical names.

          JAPANESE-JA:
          - Preserve learning item identity/order from source-context exactly.
          - vocabulary: term,reading,partOfSpeech,meaning,level,collocations,note,exampleJa,optional exampleMeaning,optional nuance.
          - grammar: pattern,level,meaning,structure,usage,exampleJa,optional exampleMeaning,optional note.
          - technicalTerms: term,optional japanese,meaning,context.
          - Keep term/reading/partOfSpeech/level/collocations/exampleJa, grammar pattern/level/structure/exampleJa, technical-term identity and mustRemember lists exactly as the skeleton.
          - Write all explanation fields freshly in natural Japanese based on original article context and Japanese dictionary-style definitions; never mechanically translate Chinese fields.

          NEVER modify src/content/daily/ or src/content/japanese/, framework code, workflows, package/audio files, or other dates. Never run a zh->ja translation pipeline. Markdown markers must be written only once; no ****, ：：, duplicated bullets/headings, broken quotes, placeholder strings, or malformed YAML.
          Before finishing, reread both outputs and self-edit unnatural Japanese, factual drift, repeated punctuation and malformed Markdown.
          EOF
          copilot --yolo -s --model auto -p "$(cat /tmp/prompt.txt)"

      - name: Validate sample
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src/content/daily src/content/japanese
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          import yaml
          date=os.environ['TARGET_DATE']
          def fm(path):
              t=Path(path).read_text(encoding='utf-8'); e=t.find('\n---\n',4)
              if not t.startswith('---\n') or e<0: raise RuntimeError(f'Bad frontmatter: {path}')
              return yaml.safe_load(t[4:e]) or {}, t
          zd,_=fm(f'src/content/daily/{date}.md'); jd,jdt=fm(f'src/content/daily-ja/{date}.md')
          zl,_=fm(f'src/content/japanese/{date}.md'); jl,jlt=fm(f'src/content/japanese-ja/{date}.md')
          if len(jdt)<10000 or len(jlt)<5000: raise RuntimeError('Generated files unexpectedly short')
          if len(zd.get('top') or [])!=5 or len(jd.get('top') or [])!=5: raise RuntimeError('Top count mismatch')
          for i,(a,b) in enumerate(zip(zd['top'],jd['top']),1):
              for k in ('title','source','topic','url'):
                  if (a.get(k) or '')!=(b.get(k) or ''): raise RuntimeError(f'Top {i} {k} mismatch')
          zv,zg,zt=zl.get('vocabulary') or [],zl.get('grammar') or [],zl.get('technicalTerms') or []
          jv,jg,jt=jl.get('vocabulary') or [],jl.get('grammar') or [],jl.get('technicalTerms') or []
          if (len(zv),len(zg),len(zt))!=(len(jv),len(jg),len(jt)): raise RuntimeError('Learning counts mismatch')
          for i,(a,b) in enumerate(zip(zv,jv),1):
              for k in ('term','reading','partOfSpeech','level','collocations','exampleJa'):
                  if a.get(k)!=b.get(k): raise RuntimeError(f'Vocabulary {i} {k} mismatch')
          for i,(a,b) in enumerate(zip(zg,jg),1):
              for k in ('pattern','level','structure','exampleJa'):
                  if a.get(k)!=b.get(k): raise RuntimeError(f'Grammar {i} {k} mismatch')
          for i,(a,b) in enumerate(zip(zt,jt),1):
              for k in ('term','japanese'):
                  if a.get(k)!=b.get(k): raise RuntimeError(f'Tech term {i} {k} mismatch')
          for k in ('mustRememberWords','mustRememberGrammar'):
              if (zl.get(k) or [])!=(jl.get(k) or []): raise RuntimeError(f'{k} mismatch')
          combined=jdt+jlt
          banned=['meaningZh','noteZh','exampleZh','nuanceZh','usageZh','contextZh','详细文字版','今日最值得看的','分类速览','面试复习卡','重点总结','日本語学习','JLPT词汇','专业词汇','JLPT语法','今日必背','为什么值得看','面试问题','约30秒回答','可关联项目','回答要点']
          hits=[x for x in banned if x in combined]
          if hits: raise RuntimeError(f'Chinese labels/schema remain: {hits}')
          # Only characters whose simplified forms are not normal Japanese kanji.
          simplified=set('这为们对让从该还进过并较仅时种发开关问题报见务动说读认语词汇习间图门长达连选适远类级员资质责财费预领顾额风飞马验驱编线组终给结统经续绿网联职药获营蓝观览视计论设访证评识诉诊译诚询详误请调谈谱负账货购贵贷赔赖赚赠赞轮软轻载辑输边迁运迟递遗邻释鉴闻闭闹阅险隐难雾页顺饮饭馆鲜鸟鸣齐齿龙')
          bad=sorted({c for c in combined if c in simplified})
          if bad: raise RuntimeError(f'Simplified-Chinese-only characters remain: {bad[:20]}')
          for p in [r'\*\*\*\*',r'：：',r'。。',r'、、',r'(?m)^#{1,6}\s+#{1,6}\s+',r'(?:\(\)){3,}',r'ZXQPH']:
              if re.search(p,combined): raise RuntimeError(f'Broken/repeated markup: {p}')
          print('Source-direct sample validation passed.')
          PY

      - name: Upload sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-direct-ja-v2-2026-09-06
          path: |
            src/content/daily-ja/2026-09-06.md
            src/content/japanese-ja/2026-09-06.md
          retention-days: 1
          if-no-files-found: warn
