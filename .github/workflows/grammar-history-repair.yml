name: Verify historical grammar repair
on:
  push:
    branches: [fix/grammar-history-dedup-2026-09-18]
    paths: ['.github/workflows/grammar-history-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: grammar-history-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_AUDIO_BASE_URL: ${{ vars.PUBLIC_AUDIO_BASE_URL || 'https://pub-7561025e67be4103ac4bafb331864381.r2.dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source transport before extracting approved paths
        shell: python
        run: |
          import base64,hashlib,io,tarfile
          from pathlib import Path
          allowed={'docs/grammar-history/identity-rules.json','docs/grammar-history/replacement-cards.json','scripts/repair-grammar-history.py','scripts/apply-grammar-guards.py','scripts/check-grammar-history.mjs','src/lib/grammarHistory.test.mjs'}
          raw=base64.b64decode(''.join(Path(f'docs/grammar-history/transport-{i}.b64').read_text().strip() for i in range(3)),validate=True)
          assert len(raw)==26916 and hashlib.sha256(raw).hexdigest()=='695f4ab5b51bbbf88b9ab2f208206ce9569c63dabd91e5192d511cf7e3673fdb', 'Grammar source checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as archive:
              members=archive.getmembers()
              assert len(members)==len(allowed) and {m.name for m in members}==allowed
              for m in members:
                  assert m.isfile() and m.size<2000000
                  path=Path(m.name);path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(archive.extractfile(m).read())
      - name: Install source-verification parsers
        run: python3 -m pip install PyYAML==6.0.2 beautifulsoup4==4.13.4
      - name: Verify original articles and apply grammar-only repair
        run: python3 scripts/repair-grammar-history.py
      - name: Install history gates and safe grammar audio mapping
        run: python3 scripts/apply-grammar-guards.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify content, history, tests, recordings and build
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/grammar-checks
          failed=0
          for task in check content:integrity:check evidence:check evidence:pilot bilingual:check-interview quality:check audio:check test audio:integrity:check build; do
            echo "::group::$task"
            if npm run "$task" 2>&1 | tee "/tmp/grammar-checks/${task//:/-}.log"; then echo "PASS $task"; else failed=1; echo "FAIL $task"; fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Verify browser interactions and security
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:browser 2>&1 | tee /tmp/grammar-checks/browser.log
          npm run security:check 2>&1 | tee /tmp/grammar-checks/security.log
          npm audit --audit-level=high 2>&1 | tee /tmp/grammar-checks/dependencies.log
      - name: Commit verified repair to review branch only
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/grammar-history-dedup-2026-09-18
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('docs/grammar-history/repair-report.json').read_text())
          assert report['after']==73 and report['historicalDuplicatesAfter']==0
          for p in Path('docs/grammar-history').glob('transport-*.b64'):p.unlink()
          Path('.github/workflows/grammar-history-repair.yml').unlink()
          Path('scripts/apply-grammar-guards.py').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/grammar-history docs/daily-quality-policy.json scripts src/content src/content.config.ts src/components/pages/LessonPage.astro src/lib/learningAudio.ts src/lib/grammarHistory.test.mjs package.json public/audio/japanese .github/workflows/grammar-history-repair.yml
          git diff --cached --stat
          git commit -m 'fix: deduplicate historical grammar with original-source anchors and full-history gates'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:$BRANCH"
          git rev-parse HEAD > /tmp/grammar-checks/VERIFIED_COMMIT.txt
      - name: Export inspectable repair and verification evidence
        if: always()
        run: |
          mkdir -p /tmp/grammar-checks
          cp docs/grammar-history/repair-report.* docs/grammar-history/source-verification.json /tmp/grammar-checks/ 2>/dev/null || true
          git diff --stat > /tmp/grammar-checks/working-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grammar-repair-verification
          path: /tmp/grammar-checks
          retention-days: 7
