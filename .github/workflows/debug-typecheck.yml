name: Debug deep link browser
on:
  push:
    branches:
      - feat/review-date-deep-links-2026-09-18
jobs:
  debug-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture targeted browser test
        shell: bash
        run: |
          set +e
          npx playwright test tests/browser/study-review.spec.ts --reporter=line > browser.log 2>&1
          code=$?
          echo "$code" > browser-exit.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-debug
          path: |
            browser.log
            browser-exit.txt
          retention-days: 1
