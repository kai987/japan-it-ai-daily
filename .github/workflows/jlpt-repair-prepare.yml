name: Prepare verified JLPT repair sources
on:
  push:
    branches: [fix/jlpt-history-dedup-2026-09-18]
    paths: ['.github/workflows/jlpt-repair-prepare.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install extraction tools
        run: python3 -m pip install requests==2.32.3 beautifulsoup4==4.13.4 PyYAML==6.0.2 Janome==0.5.0
      - name: Extend article selectors without accepting whole-page navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/jlpt-history-collect.py')
          s=p.read_text()
          s=s.replace("root=(soup.select_one('.entry-content')", "root=(soup.select_one('#cmsBody') or soup.select_one('.entry-body') or soup.select_one('.itmdBody') or soup.select_one('.article-body') or soup.select_one('.entry-content')")
          p.write_text(s)
      - name: Extract historical Top 5 originals
        run: python3 scripts/jlpt-history-collect.py /tmp/jlpt-prepared
      - name: Preserve source-selector diagnostics for manual review
        shell: python
        run: |
          import json,requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          out=Path('/tmp/jlpt-prepared');rows=json.loads((out/'sources.json').read_text())
          errors=[]
          for r in rows:
            if r.get('status')!=200 or 'textSha256' in r: continue
            try:
              x=requests.get(r['url'],timeout=15,headers={'User-Agent':'Mozilla/5.0'})
              x.encoding='utf-8'
              h=BeautifulSoup(x.text,'html.parser')
              errors.append({'date':r['date'],'url':r['url'],'containers':[(n.get('id'),n.get('class'),len(n.get_text())) for n in h.find_all(['div','section','article']) if len(n.get_text())>500][:40]})
            except Exception as e: errors.append({'url':r['url'],'error':str(e)})
          (out/'selector-diagnostics.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2))
      - name: Export public N1 mirror source without modifying it
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse https://github.com/kai987/Japanese-N1-Immersive-Sparring-Partner.git /tmp/n1-mirror
          cd /tmp/n1-mirror
          git sparse-checkout set src scripts .github/workflows
          mkdir -p /tmp/jlpt-prepared/n1-mirror
          git rev-parse HEAD > /tmp/jlpt-prepared/n1-mirror/SNAPSHOT_COMMIT.txt
          python3 -c 'from pathlib import Path;import shutil;out=Path("/tmp/jlpt-prepared/n1-mirror");[( (out/p).parent.mkdir(parents=True,exist_ok=True),shutil.copy2(p,out/p)) for p in Path(".").rglob("*") if p.is_file() and ".git" not in p.parts and p.suffix in {".json",".md",".ts",".tsx",".mjs",".js",".yml",".yaml",".css",".html"}]'
      - name: Upload prepared evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jlpt-prepared-evidence
          path: /tmp/jlpt-prepared
          retention-days: 3
