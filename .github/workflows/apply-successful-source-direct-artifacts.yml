name: Preserve validated Japanese artifacts

on:
  push:
    branches: [repair/japanese-history-from-originals]
    paths:
      - '.github/workflows/apply-successful-source-direct-artifacts.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download validated September 6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/kai987/japan-it-ai-daily/actions/artifacts/9996478673/zip' \
            -o /tmp/artifact/artifact.zip
          unzip -q /tmp/artifact/artifact.zip -d /tmp/artifact/unzip
          cp /tmp/artifact/unzip/src/content/daily-ja/2026-09-06.md src/content/daily-ja/2026-09-06.md
          cp /tmp/artifact/unzip/src/content/japanese-ja/2026-09-06.md src/content/japanese-ja/2026-09-06.md

      - name: Prove Chinese content remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main -- src/content/daily src/content/japanese
          test -s src/content/daily-ja/2026-09-06.md
          test -s src/content/japanese-ja/2026-09-06.md

      - name: Commit validated September 6 content
        shell: bash
        run: |
          set -euo pipefail
          git add src/content/daily-ja/2026-09-06.md src/content/japanese-ja/2026-09-06.md
          if git diff --cached --quiet; then
            echo 'No September 6 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: preserve validated September 6 Japanese source rewrite'
          git push origin HEAD:repair/japanese-history-from-originals
