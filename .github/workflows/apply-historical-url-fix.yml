name: Apply verified historical article URLs

on:
  push:
    branches:
      - fix/verify-historical-source-urls-20260901

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Apply verified URL fixes
        run: python3 scripts/.historical-url-fix/apply.py
      - name: Remove one-time helpers
        run: |
          rm -rf scripts/.historical-url-fix
          rm -f .github/workflows/apply-historical-url-fix.yml
      - name: Commit verified historical metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/daily scripts/.historical-url-fix .github/workflows/apply-historical-url-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "content: restore verified historical article URLs"
          git push origin HEAD:fix/verify-historical-source-urls-20260901
