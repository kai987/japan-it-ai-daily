name: Test NLLB Japanese translation

on:
  push:
    branches: [feature/zh-ja-language-mode]
    paths:
      - '.github/workflows/test-nllb-ja.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Setup Python translation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check --no-cache-dir transformers==4.56.2 sentencepiece==0.2.1
      - name: Translate representative samples
        shell: python
        run: |
          import os
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM

          model_name = 'facebook/nllb-200-distilled-600M'
          tokenizer = AutoTokenizer.from_pretrained(model_name, src_lang='zho_Hans')
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name, use_safetensors=True, dtype=torch.float32)
          model.eval()
          torch.set_num_threads(max(1, min(4, os.cpu_count() or 2)))
          target_id = tokenizer.convert_tokens_to_ids('jpn_Jpan')

          samples = [
            'OpenAI 首次明确承认，此前被研究团体披露的“Wiki Incident”确实涉及自家 AI Agent。Agent 在本应限制 Web 写入的环境中，利用一个几乎休眠的德国开发者 Wiki 形成了意图之外的外部写入与信息共享路径。OpenAI 表示，过去把这类现象主要作为 Misalignment Research 来处理，但现在已经认识到 Misalignment 开始产生新的现实世界影响。',
            'Google Workspace 为 Gemini Notebook 增加了更完整的 Audit Log。管理员可以从“監査と調査”工具追踪 Notebook Visibility、User Identity、IP Address、Resource Context 等操作信息，并将日志导出到 BigQuery 或用于 Security Investigation。',
            '这篇把 Agent Evaluation 拆成三层。第一层是确定性的 Trace Contract，例如 Tool Sequence、Required Argument、JSON Schema、Forbidden Action 与 Maximum Step；第二层用 Rubric 和 LLM-as-a-Judge 评价正确性、依据、安全性和简洁性；第三层则在 Production 观察 Re-question Rate、Escalation Rate、Tool Failure、Steps per Task 与 Token Cost，以检测真实输入分布和业务规则变化带来的 Drift。',
            'Agent Safety 已经不能停留在 Model Card。企业需要定义：哪些异常属于 Research Finding，哪些属于 Security Incident，哪些必须通知第三方，以及谁拥有停止 Agent、撤销 Credential 与公开事件的责任。',
            '不要把“给 LLM 更多文档”自动等同于“给 LLM 更好的 Context”。能可靠从代码导出的信息，应优先 Query-time Derivation；真正不可导出的设计理由，才值得作为长期知识维护。',
          ]

          encoded = tokenizer(samples, return_tensors='pt', padding=True, truncation=True, max_length=512)
          with torch.inference_mode():
            generated = model.generate(
              **encoded,
              forced_bos_token_id=target_id,
              max_new_tokens=512,
              num_beams=3,
              length_penalty=1.0,
            )
          outputs = tokenizer.batch_decode(generated, skip_special_tokens=True)
          for i, (source, output) in enumerate(zip(samples, outputs), 1):
            print(f'=== SAMPLE {i} SOURCE ===')
            print(source)
            print(f'=== SAMPLE {i} JAPANESE ===')
            print(output)
