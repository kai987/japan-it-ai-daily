name: JLPT history repair validation
on:
  push:
    branches: [fix/jlpt-vocabulary-history-20260918]
    paths:
      - '.github/workflows/jlpt-history-repair.yml'
      - 'scripts/jlpt-history*'
      - 'docs/jlpt-history-repair/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Package authored replacement bank
        shell: python
        run: |
          from pathlib import Path
          import zipfile,json,collections
          counts=collections.Counter()
          with zipfile.ZipFile('jlpt-bank.zip','w',zipfile.ZIP_DEFLATED) as out:
              for path in sorted(Path('docs/jlpt-vocabulary-backfill').glob('*.psv')):
                  out.write(path,str(path))
                  for i,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                      if not line.strip() or line.startswith('#'): continue
                      fields=line.split('|')
                      assert len(fields)==14, (str(path),i,len(fields))
                      assert len(fields[9].split(';'))>=2, (str(path),i)
                      counts[fields[0]]+=1
          print(json.dumps({'replacementCards':sum(counts.values()),'days':len(counts),'perDay':counts},ensure_ascii=False))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jlpt-authored-bank
          path: jlpt-bank.zip
          retention-days: 1
          if-no-files-found: error
