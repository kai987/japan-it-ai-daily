name: Test local Qwen source-direct Japanese regeneration

on:
  push:
    branches: [repair/japanese-history-from-originals]
    paths:
      - '.github/workflows/test-local-qwen-source-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_DATE: '2026-09-06'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare original-source context
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir pyyaml==6.0.2 requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1
          rm -rf /tmp/qwen-ja && mkdir -p /tmp/qwen-ja/originals
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import requests, yaml
          from bs4 import BeautifulSoup

          date=os.environ['TARGET_DATE']
          def fm(path):
              text=Path(path).read_text(encoding='utf-8'); end=text.find('\n---\n',4)
              if not text.startswith('---\n') or end<0: raise RuntimeError(path)
              return yaml.safe_load(text[4:end]) or {}
          daily=fm(f'src/content/daily/{date}.md')
          lesson=fm(f'src/content/japanese/{date}.md')
          top=daily.get('top') or []
          if len(top)!=5: raise RuntimeError('Top 5 mismatch')
          context={
            'date':date,
            'topics':daily.get('topics') or [],
            'sources':daily.get('sources') or [],
            'featured':bool(daily.get('featured',False)),
            'top':[{'title':x.get('title',''),'source':x.get('source',''),'topic':x.get('topic',''),'url':x.get('url','')} for x in top],
            'learning':{
              'topics':lesson.get('topics') or [],
              'levels':lesson.get('levels') or [],
              'vocabularyCount':lesson.get('vocabularyCount',0),
              'grammarCount':lesson.get('grammarCount',0),
              'vocabulary':[{'term':x.get('term',''),'reading':x.get('reading',''),'partOfSpeech':x.get('partOfSpeech',''),'level':x.get('level',''),'collocations':x.get('collocations') or [],'exampleJa':x.get('exampleJa','')} for x in (lesson.get('vocabulary') or [])],
              'grammar':[{'pattern':x.get('pattern',''),'level':x.get('level',''),'structure':x.get('structure',''),'exampleJa':x.get('exampleJa','')} for x in (lesson.get('grammar') or [])],
              'technicalTerms':[{'term':x.get('term',''),**({'japanese':x.get('japanese')} if x.get('japanese') else {})} for x in (lesson.get('technicalTerms') or [])],
              'mustRememberWords':lesson.get('mustRememberWords') or [],
              'mustRememberGrammar':lesson.get('mustRememberGrammar') or [],
            }
          }
          Path('/tmp/qwen-ja/source-context.json').write_text(json.dumps(context,ensure_ascii=False,indent=2),encoding='utf-8')
          headers={'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Accept-Language':'ja,en;q=0.8'}
          for i,x in enumerate(top,1):
              url=x.get('url') or ''; p=Path(f'/tmp/qwen-ja/originals/{i:02d}.txt')
              try:
                  r=requests.get(url,headers=headers,timeout=30,allow_redirects=True); r.raise_for_status()
                  if not r.encoding or r.encoding.lower()=='iso-8859-1': r.encoding=r.apparent_encoding or 'utf-8'
                  soup=BeautifulSoup(r.text,'lxml')
                  for tag in soup(['script','style','noscript','svg','form','nav','footer','header','aside']): tag.decompose()
                  root=soup.find('article') or soup.find('main') or soup.body or soup
                  text=re.sub(r'\n{3,}','\n\n',root.get_text('\n',strip=True))[:6500]
                  p.write_text(f'URL: {r.url}\nSOURCE_TITLE: {x.get("title","")}\n\n{text}\n',encoding='utf-8')
                  print(i, r.status_code, len(text), r.url)
              except Exception as e:
                  p.write_text(f'URL: {url}\nSOURCE_TITLE: {x.get("title","")}\nFETCH_STATUS: failed\nERROR: {e}\n',encoding='utf-8')
                  print(f'::warning::article {i} fetch failed: {e}')
          PY

      - name: Build pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch b10826 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON
          cmake --build /tmp/llama.cpp/build --config Release -j 2 --target llama-server

      - name: Start Qwen3-4B local server
        shell: bash
        run: |
          set -euo pipefail
          /tmp/llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen3-4B-GGUF:Q4_K_M \
            --alias qwen3-4b \
            --host 127.0.0.1 --port 8080 \
            --jinja -c 32768 -t 4 > /tmp/qwen-server.log 2>&1 &
          echo $! > /tmp/qwen-server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo 'Qwen server ready.'
              exit 0
            fi
            sleep 5
          done
          tail -n 100 /tmp/qwen-server.log || true
          exit 1

      - name: Generate source-direct Japanese sample
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, requests
          from pathlib import Path

          date=os.environ['TARGET_DATE']
          root=Path('/tmp/qwen-ja')
          context=json.loads((root/'source-context.json').read_text(encoding='utf-8'))
          original_parts=[]
          for i in range(1,6):
              original_parts.append(f'\n\n===== ORIGINAL ARTICLE {i} =====\n'+(root/f'originals/{i:02d}.txt').read_text(encoding='utf-8'))
          originals=''.join(original_parts)

          system='''あなたは日本のIT/AI技術メディアのシニア編集者です。自然で正確な日本語だけを書きます。中国語から翻訳してはいけません。与えられた原文と事実メタデータだけを根拠にし、推測を加えません。Markdown/YAMLを壊さず、重複記号を出しません。 /no_think'''
          daily_prompt=f'''以下のSOURCE CONTEXTとORIGINAL ARTICLESだけから、{date}の日本語モード詳細日報を作成してください。中国語の中間稿は存在しないものとして扱ってください。

SOURCE CONTEXT:\n{json.dumps(context,ensure_ascii=False,indent=2)}\n{originals}

出力はファイル本文だけ。コードフェンスや前置きは禁止。
Frontmatterは title,date,description,topics,sources,top,featured。topは5件で、title/source/topic/urlをSOURCE CONTEXTから一字一句変えず、whyのみ自然な日本語で新規作成。
本文は必ず # A. 詳細版 / ## 1. 今日読むべき5本 / ①〜⑤ / ## 2. カテゴリ別サマリー / ## 3. 面接で使えるポイント / ## 4. 今日の技術テーマ / ## 5. 面接復習カード / # B. 重要ポイントと面接で使える知識 / # C. 日本語学習｜JLPT + IT日本語 の構成にする。
各Top 5は出典、原文 URL、原文に忠実な技術要約、注目ポイントを含める。Bも原文から直接再整理する。Cは構造化学習ページへの短い導入だけでよい。
不自然な直訳調、****、：：、()()()、重複見出し、壊れたMarkdownは禁止。 /no_think'''

          def chat(user, max_tokens):
              payload={'model':'qwen3-4b','messages':[{'role':'system','content':system},{'role':'user','content':user}],
                       'temperature':0.7,'top_p':0.8,'max_tokens':max_tokens,'presence_penalty':1.2}
              r=requests.post('http://127.0.0.1:8080/v1/chat/completions',json=payload,timeout=1800)
              r.raise_for_status(); return r.json()['choices'][0]['message']['content'].strip()

          daily=chat(daily_prompt,7000)
          daily=re.sub(r'^```(?:markdown|yaml)?\s*|\s*```$','',daily,flags=re.I|re.S).strip()+'\n'
          (root/'daily-ja.md').write_text(daily,encoding='utf-8')

          lesson_prompt=f'''SOURCE CONTEXTのlearning skeletonと、上で原文から直接作成した日本語日報を根拠に、{date}の構造化日本語学習ファイルを作成してください。中国語説明を翻訳してはいけません。

SOURCE CONTEXT:\n{json.dumps(context,ensure_ascii=False,indent=2)}

SOURCE-DIRECT JAPANESE DAILY:\n{daily}

出力はファイル本文だけ。コードフェンスや前置きは禁止。
Frontmatter: title,date,description,topics,levels,vocabularyCount,grammarCount,vocabulary,grammar,technicalTerms,mustRememberWords,mustRememberGrammar。
vocabularyは skeleton の term/reading/partOfSpeech/level/collocations/exampleJa を順序も含めて完全維持し、meaning,note,exampleMeaning,nuance を自然な日本語で新規執筆。
grammarは pattern/level/structure/exampleJa を完全維持し、meaning,usage,exampleMeaning,note を自然な日本語で執筆。
technicalTermsはtermとjapaneseを維持し、meaning/contextを自然な日本語で執筆。mustRememberWords/Grammarも完全維持。
本文は # C. 日本語学習｜JLPT + IT日本語 と短い日本語導入だけ。
meaningZh等の中国語モードfieldは禁止。不自然な直訳調や重複記号は禁止。 /no_think'''
          lesson=chat(lesson_prompt,7000)
          lesson=re.sub(r'^```(?:markdown|yaml)?\s*|\s*```$','',lesson,flags=re.I|re.S).strip()+'\n'
          (root/'japanese-ja.md').write_text(lesson,encoding='utf-8')
          print('daily bytes',len(daily.encode()),'lesson bytes',len(lesson.encode()))
          PY

      - name: Validate local-model sample
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, yaml
          from pathlib import Path
          root=Path('/tmp/qwen-ja')
          for p in [root/'daily-ja.md',root/'japanese-ja.md']:
              t=p.read_text(encoding='utf-8')
              if not t.startswith('---\n') or '\n---\n' not in t: raise RuntimeError(f'bad frontmatter {p}')
              e=t.find('\n---\n',4); yaml.safe_load(t[4:e])
              if len(t.encode())<6000: raise RuntimeError(f'too short {p}: {len(t.encode())}')
              for bad in ['****','：：','()()()','ZXQPH','详细文字版','分类速览','面试复习卡','重点总结','日本語学习','JLPT词汇','专业词汇','JLPT语法','今日必背','meaningZh','noteZh','exampleZh','nuanceZh','usageZh','contextZh']:
                  if bad in t: raise RuntimeError(f'{p}: bad token {bad}')
          print('Basic Qwen sample validation passed.')
          PY
          git diff --exit-code -- src/content/daily src/content/japanese

      - name: Upload Qwen sample
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-qwen-source-direct-2026-09-06
          path: |
            /tmp/qwen-ja/daily-ja.md
            /tmp/qwen-ja/japanese-ja.md
            /tmp/qwen-server.log
          retention-days: 1
