name: Draft bounded JLPT replacement cards
on:
  push:
    branches: [fix/jlpt-history-dedup-2026-09-18]
    paths: ['.github/workflows/jlpt-repair-draft.yml']
permissions:
  contents: read
  copilot-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Download already inspected original article evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35256897039 --repo kai987/japan-it-ai-daily --name jlpt-originals-and-candidates --dir /tmp/jlpt-source-evidence
      - name: Install repository's existing authoring CLI
        run: npm install -g @github/copilot
      - name: Generate constrained editorial drafts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/draft-jlpt-repair.py ${{ matrix.batch }} /tmp/jlpt-source-evidence
      - name: Upload drafts for review, not publication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jlpt-cards-${{ matrix.batch }}
          path: /tmp/jlpt-drafts
          retention-days: 3
