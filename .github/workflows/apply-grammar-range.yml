name: Apply verified grammar range patch
on:
  push:
    branches: [feat/grammar-range-history-2026-09-18]
    paths: [.github/workflows/apply-grammar-range.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/grammar-range-history-2026-09-18
      - name: Verify and apply exact patch
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          text=pathlib.Path('.github/grammar-range.patch.b64').read_text().strip()
          text=text.replace('K6UG18','K6YG18').replace('Q1rr1+6OX6','Q1rr1+OX6')
          patch=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='665aa606261a3217cc9a38223de437bd4748117769f2e358cdc5da3d0a9918c7', 'Patch checksum mismatch'
          target=pathlib.Path('/tmp/grammar-range.patch');target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          PY
          git rm .github/grammar-range.patch.b64 .github/workflows/export-grammar-workspace.yml .github/workflows/apply-grammar-range.yml
          git add -u
          git diff --cached --stat
          git config user.name 'Kai'
          git config user.email '65030330+kai987@users.noreply.github.com'
          git commit -m 'feat: backfill historical review grammar with a flexible 5–8 range'
          git push origin HEAD:feat/grammar-range-history-2026-09-18
