name: Prepare verified learning UI upgrade
on:
  push:
    branches: [work/study-ui-test-2026-09-18]
    paths: [.github/workflows/prepare-study-upgrade.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: work/study-ui-test-2026-09-18
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply byte-verified source edits
        run: python3 .review-transfer/apply.py
      - name: Validate full repository
        run: |
          npm ci
          npm run check
          npm run content:integrity:check
          npm run bilingual:check-interview
          npm run quality:check
          npm test
          npm run build
          npm run security:check
      - name: Commit reviewed UI files on the staging branch only
        run: |
          git rm .review-transfer/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/components/pages src/content/daily/2026-09-18.md src/content/daily-ja/2026-09-18.md
          git commit -m 'feat: display separate reviews, frequencies and issue numbers'
          git push origin HEAD:work/study-ui-test-2026-09-18
