name: Sync audio to Cloudflare R2

on:
  push:
    branches: [main]
    paths:
      - 'public/audio/**'
      - '.github/workflows/sync-r2-audio.yml'
      - 'scripts/verify-audio-integrity.mjs'
      - 'scripts/audio-manifest-state.mjs'
      - 'scripts/remote-audio.mjs'
      - 'scripts/audio-publication.mjs'
      - 'scripts/stage-audio-publication.mjs'
      - 'src/lib/audioVersion.mjs'
      - 'scripts/validate-interview-audio-duration.mjs'
      - 'scripts/interview-audio-content.mjs'
      - 'scripts/structured-interview.mjs'
      - 'scripts/validate-structured-interviews.mjs'
      - 'src/lib/structuredInterview.mjs'
      - 'src/data/interviews/**'
      - 'docs/structured-interview-policy.json'
      - 'scripts/daily-quality-policy.mjs'
      - 'docs/daily-quality-policy.json'
      - 'scripts/audio-file-versions.mjs'
      - 'scripts/audit-r2-audio-orphans.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * 1'

permissions:
  contents: read

concurrency:
  group: r2-audio-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: japan-it-ai-daily-audio
      R2_PUBLIC_BASE_URL: ${{ vars.PUBLIC_AUDIO_BASE_URL || 'https://pub-7561025e67be4103ac4bafb331864381.r2.dev' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      SYNC_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify audio text and files
        run: npm run audio:integrity:check

      - name: Ensure ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Verify actual interview audio duration
        run: npm run audio:duration:check

      - name: Sync audio to R2
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${R2_ACCOUNT_ID}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::R2 credentials are required before audio can be published."
            exit 1
          fi

          # Accept the 32-character Account ID, the S3 hostname, or the full HTTPS endpoint.
          account_ref="${R2_ACCOUNT_ID%/}"
          account_ref="${account_ref#https://}"
          account_ref="${account_ref#http://}"
          account_ref="${account_ref%%/*}"
          account_id="${account_ref%.r2.cloudflarestorage.com}"

          if [[ ! "${account_id}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID (or its exact R2 S3 endpoint/hostname). Please update the repository secret; do not use the public r2.dev URL, token ID, Access Key ID, or bucket name."
            exit 1
          fi

          endpoint="https://${account_id}.r2.cloudflarestorage.com"
          echo "R2_ENDPOINT=${endpoint}" >> "${GITHUB_ENV}"

          # Full/manual runs inspect MP3 bytes before any repair. Manifests are
          # retained in R2 for the existing complete-object inventory audit.
          sync_filters=(--exclude '*.mp3')
          sync_source=public/audio/
          upload_audio=true
          echo "R2_VERIFY_SCOPE=full" >> "${GITHUB_ENV}"
          # If the push comparison base is available, upload only changed audio.
          # Workflow/script-only changes still continue to verification and orphan audit.
          if [[ -n "${SYNC_BEFORE}" ]] && git cat-file -e "${SYNC_BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only -z "${SYNC_BEFORE}" HEAD > "${RUNNER_TEMP}/audio-verify-changes"
            git diff --name-only -z --diff-filter=ACMR --relative=public/audio \
              "${SYNC_BEFORE}" HEAD -- public/audio/ > "${RUNNER_TEMP}/audio-changes"
            mapfile -d '' -t changed_audio < "${RUNNER_TEMP}/audio-changes"
            if (( ${#changed_audio[@]} == 0 )); then
              echo "No audio files changed; skipping upload and continuing verification/audit."
              upload_audio=false
            else
              # A simultaneous verifier/policy change merits a full audit.
              if git diff --quiet "${SYNC_BEFORE}" HEAD -- scripts/ src/lib/audioVersion.mjs .github/workflows/sync-r2-audio.yml docs/daily-quality-policy.json package.json package-lock.json; then
                echo "R2_VERIFY_SCOPE=changed" >> "${GITHUB_ENV}"
              fi
              sync_source="${RUNNER_TEMP}/audio-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
              node scripts/stage-audio-publication.mjs \
                --changed-file "${RUNNER_TEMP}/audio-verify-changes" --staging "${sync_source}"
              sync_filters=()
            fi
          fi

          if [[ "${upload_audio}" == "true" ]]; then
            aws s3 sync "${sync_source}" "s3://${R2_BUCKET}/" \
              --endpoint-url "${endpoint}" \
              "${sync_filters[@]}" \
              --only-show-errors \
              --cache-control "public,max-age=86400"
          fi

      - name: Verify recordings and repair only confirmed remote drift
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${R2_ENDPOINT:-}" ]]; then
            echo "::error::R2 endpoint was not initialized."
            exit 1
          fi

          verify_args=(--remote --repair)
          if [[ "${R2_VERIFY_SCOPE}" == "changed" ]]; then
            verify_args+=(--changed-file "${RUNNER_TEMP}/audio-verify-changes")
          fi
          node scripts/verify-audio-integrity.mjs "${verify_args[@]}"

      - name: Audit and safely prune legacy R2 audio orphans
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${R2_ENDPOINT:-}" ]]; then
            echo "::error::R2 endpoint was not initialized."
            exit 1
          fi

          before_json="${RUNNER_TEMP}/r2-audio-objects-before.json"
          before_report="${RUNNER_TEMP}/r2-audio-orphans-before.json"
          safe_list="${RUNNER_TEMP}/r2-audio-safe-prune.txt"

          aws s3api list-objects-v2 \
            --bucket "${R2_BUCKET}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --query 'Contents[].{Key:Key,Size:Size}' \
            --output json > "${before_json}"

          node scripts/audit-r2-audio-orphans.mjs \
            --remote "${before_json}" \
            --report "${before_report}" \
            --safe-list "${safe_list}" \
            --fail-on-missing

          safe_count=0
          if [[ -s "${safe_list}" ]]; then
            while IFS= read -r key; do
              [[ -z "${key}" ]] && continue
              case "${key}" in
                japanese/????-??-??/review-vocab-[0-9][0-9].mp3|\
                japanese/????-??-??/review-example-[0-9][0-9].mp3|\
                japanese/????-??-??/review-grammar-example-[0-9][0-9].mp3|\
                japanese/2026-08-29/interview-answer-06.mp3)
                  aws s3 rm "s3://${R2_BUCKET}/${key}" \
                    --endpoint-url "${R2_ENDPOINT}" \
                    --only-show-errors
                  safe_count=$((safe_count + 1))
                  ;;
                *)
                  echo "::error::Refusing to auto-delete unexpected key: ${key}"
                  exit 1
                  ;;
              esac
            done < "${safe_list}"
          fi

          after_json="${RUNNER_TEMP}/r2-audio-objects-after.json"
          after_report="${RUNNER_TEMP}/r2-audio-orphans-after.json"
          aws s3api list-objects-v2 \
            --bucket "${R2_BUCKET}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --query 'Contents[].{Key:Key,Size:Size}' \
            --output json > "${after_json}"

          node scripts/audit-r2-audio-orphans.mjs \
            --remote "${after_json}" \
            --report "${after_report}" \
            --require-no-safe-orphans \
            --fail-on-missing

          node - "${before_report}" "${after_report}" "${safe_count}" >> "${GITHUB_STEP_SUMMARY}" <<'NODE'
          const fs = require('fs');
          const [beforePath, afterPath, deleted] = process.argv.slice(2);
          const before = JSON.parse(fs.readFileSync(beforePath, 'utf8'));
          const after = JSON.parse(fs.readFileSync(afterPath, 'utf8'));
          console.log('## R2 audio orphan audit');
          console.log('');
          console.log(`- Managed local files: ${after.localManagedCount}`);
          console.log(`- Managed R2 objects: ${after.remoteManagedCount}`);
          console.log(`- Safe legacy files deleted automatically: ${deleted}`);
          console.log(`- Remaining R2-only objects (audit only): ${after.otherOrphans.length}`);
          console.log(`- Local managed files missing from R2: ${after.missingRemote.length}`);
          if (after.otherOrphans.length) {
            console.log('');
            console.log('### Remaining R2-only objects');
            for (const item of after.otherOrphans) console.log(`- \`${item.key}\``);
          }
          NODE
