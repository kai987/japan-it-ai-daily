name: Sync audio to Cloudflare R2

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-audio-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: japan-it-ai-daily-audio
      R2_PUBLIC_BASE_URL: ${{ vars.PUBLIC_AUDIO_BASE_URL || 'https://pub-7561025e67be4103ac4bafb331864381.r2.dev' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      SYNC_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify audio text and files
        run: npm run audio:integrity:check

      - name: Ensure ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Verify actual interview audio duration
        run: npm run audio:duration:check

      - name: Sync audio to R2
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${R2_ACCOUNT_ID}" || -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "::error::R2 credentials are required before the website can be published."
            exit 1
          fi

          # Accept the 32-character Account ID, the S3 hostname, or the full HTTPS endpoint.
          account_ref="${R2_ACCOUNT_ID%/}"
          account_ref="${account_ref#https://}"
          account_ref="${account_ref#http://}"
          account_ref="${account_ref%%/*}"
          account_id="${account_ref%.r2.cloudflarestorage.com}"

          if [[ ! "${account_id}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID (or its exact R2 S3 endpoint/hostname). Please update the repository secret; do not use the public r2.dev URL, token ID, Access Key ID, or bucket name."
            exit 1
          fi

          endpoint="https://${account_id}.r2.cloudflarestorage.com"

          sync_filters=()
          # The reusable workflow retains the caller's push event. If its base
          # is available, only upload changed paths; always verify ALL public MP3s.
          # Manual runs or multi-commit pushes without that base use a full sync.
          if [[ -n "${SYNC_BEFORE}" ]] && git cat-file -e "${SYNC_BEFORE}^{commit}" 2>/dev/null; then
            git diff --name-only -z --diff-filter=ACMR --relative=public/audio \
              "${SYNC_BEFORE}" HEAD -- public/audio/ > "${RUNNER_TEMP}/audio-changes"
            mapfile -d '' -t changed_audio < "${RUNNER_TEMP}/audio-changes"
            if (( ${#changed_audio[@]} == 0 )); then
              echo "No audio files changed; skipping upload, then verifying all public recordings."
              exit 0
            fi
            sync_filters=(--exclude '*')
            for path in "${changed_audio[@]}"; do
              sync_filters+=(--include "${path}")
            done
          fi

          aws s3 sync public/audio/ "s3://${R2_BUCKET}/" \
            --endpoint-url "${endpoint}" \
            "${sync_filters[@]}" \
            --only-show-errors \
            --cache-control "public,max-age=86400"

      - name: Verify all public recordings against this commit
        run: node scripts/verify-audio-integrity.mjs --remote
