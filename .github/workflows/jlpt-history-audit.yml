name: JLPT history audit

on:
  push:
    branches: [fix/jlpt-history-dedup-2026-09-18]
    paths:
      - '.github/workflows/jlpt-history-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export versioned source without audio binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jlpt-source
          git rev-parse HEAD > /tmp/jlpt-source/SNAPSHOT_COMMIT.txt
          git ls-files -z | python3 -c 'import sys,pathlib,shutil; root=pathlib.Path("/tmp/jlpt-source/repository"); allowed={".md",".json",".ts",".tsx",".js",".mjs",".cjs",".astro",".yml",".yaml",".css",".html",".toml",".txt",".py"}; paths=[p for p in sys.stdin.buffer.read().decode().split("\0") if p]; [( (root/p).parent.mkdir(parents=True,exist_ok=True),shutil.copy2(p,root/p)) for p in paths if pathlib.Path(p).is_file() and (pathlib.Path(p).suffix in allowed or pathlib.Path(p).name in {".gitignore",".npmrc",".nvmrc"}) and not p.startswith("public/audio/")]'
      - name: Upload audit source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jlpt-history-source
          path: /tmp/jlpt-source
          include-hidden-files: true
          retention-days: 3
