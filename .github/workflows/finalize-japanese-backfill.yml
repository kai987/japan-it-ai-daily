name: Finalize Japanese backfill

on:
  push:
    branches: [feature/zh-ja-language-mode]
    paths:
      - '.github/workflows/finalize-japanese-backfill.yml'

permissions:
  contents: read

concurrency:
  group: finalize-japanese-backfill
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Finalizer paused while translation quality is revalidated.'
