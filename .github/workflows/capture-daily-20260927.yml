name: Capture public originals 2026-09-27
on:
  push:
    branches: [automation/daily-progress]
    paths: [.github/workflows/capture-daily-20260927.yml]
permissions:
  contents: read
concurrency:
  group: capture-public-originals-20260927
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.13.5
      - name: Read public article pages and retain exact bytes
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, pathlib, json, hashlib, datetime, time
          from bs4 import BeautifulSoup
          urls = [
            'https://dev.classmethod.jp/articles/litellm-deepeval-jev/',
            'https://dev.classmethod.jp/articles/20260924-cc-updates-v2-1-283/',
            'https://dev.classmethod.jp/articles/kiro-web-upload-local-kiro/',
            'https://zenn.dev/kichiemon/articles/comfyui-h3-text-encoder',
            'https://zenn.dev/hontsuke/articles/0118c6df497a6a',
          ]
          out=pathlib.Path('/tmp/originals-20260927');out.mkdir()
          records=[]
          for i,url in enumerate(urls,1):
              rec={'id':i,'url':url,'fetchedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; PublicSourceVerification/1.0)'}),timeout=40) as response:
                              data=response.read();rec['status']=response.status;rec['finalUrl']=response.url
                          break
                      except urllib.error.HTTPError as e:
                          if e.code in (401,403) or e.code not in (429,500,502,503,504) or attempt==2: raise
                          time.sleep(2**attempt)
                      except (urllib.error.URLError,TimeoutError):
                          if attempt==2: raise
                          time.sleep(2**attempt)
                  (out/f'{i:02}.html').write_bytes(data)
                  rec['htmlSha256']=hashlib.sha256(data).hexdigest()
                  soup=BeautifulSoup(data,'html.parser')
                  rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  rec['meta']=[dict(x.attrs) for x in soup.find_all('meta') if any(t in str(x.attrs) for t in ('published','modified','date','description','og:title'))]
                  rec['times']=[dict(attrs=x.attrs,text=x.get_text()) for x in soup.find_all('time')]
                  rec['jsonLd']=[x.get_text() for x in soup.find_all('script',type='application/ld+json')]
                  rec['links']=[{'text':a.get_text(' ',strip=True),'url':a.get('href')} for a in soup.find_all('a',href=True) if a.get('href','').startswith('http')]
                  (out/f'{i:02}.next.json').write_text(soup.find('script',id='__NEXT_DATA__').get_text() if soup.find('script',id='__NEXT_DATA__') else '{}')
                  for x in soup(['script','style','nav','footer','header','noscript']):x.decompose()
                  article=soup.find('article') or soup.find('main') or soup.body or soup
                  text=article.get_text('\n',strip=True)+'\n'
                  payload=text.encode('utf-8');(out/f'{i:02}.txt').write_bytes(payload)
                  rec['sha256']=hashlib.sha256(payload).hexdigest();rec['textBytes']=len(payload);rec['selector']=article.name
              except Exception as e:
                  rec['error']=str(e);rec['status']='unverified'
              records.append(rec)
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{k:r[k] for k in ('id','url','status','textBytes','error') if k in r} for r in records],ensure_ascii=False))
          if any(r.get('status')!=200 for r in records):raise SystemExit('One or more public originals are unverified; inspect manifest before authoring.')
          PY
      - name: Retain source verification artifacts, not repository files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: originals-20260927-candidates
          path: /tmp/originals-20260927/
          if-no-files-found: error
          retention-days: 3
