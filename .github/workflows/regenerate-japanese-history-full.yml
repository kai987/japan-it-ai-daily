name: Regenerate all historical Japanese content from original sources

on:
  push:
    branches: [repair/japanese-history-from-originals]
    paths:
      - '.github/workflows/regenerate-japanese-history-full.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-direct-japanese-history-full
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Copilot backfill paused because the monthly Copilot request quota is exhausted. Source-direct regeneration will continue with a non-Copilot path.'
