name: Regenerate all historical Japanese content from original sources

on:
  push:
    branches: [repair/japanese-history-from-originals]
    paths:
      - '.github/workflows/regenerate-japanese-history-full.yml'
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: source-direct-japanese-history-full
  cancel-in-progress: true

jobs:
  regenerate:
    name: regenerate-${{ matrix.date }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        date:
          - '2026-08-12'
          - '2026-08-13'
          - '2026-08-14'
          - '2026-08-15'
          - '2026-08-16'
          - '2026-08-17'
          - '2026-08-18'
          - '2026-08-19'
          - '2026-08-20'
          - '2026-08-21'
          - '2026-08-22'
          - '2026-08-23'
          - '2026-08-24'
          - '2026-08-25'
          - '2026-08-26'
          - '2026-08-27'
          - '2026-08-28'
          - '2026-08-29'
          - '2026-08-30'
          - '2026-08-31'
          - '2026-09-01'
          - '2026-09-02'
          - '2026-09-03'
          - '2026-09-04'
          - '2026-09-05'
          - '2026-09-06'
    env:
      TARGET_DATE: ${{ matrix.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install source and generation tools
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            pyyaml==6.0.2 requests==2.32.5 beautifulsoup4==4.13.5 lxml==6.0.1

      - name: Build source-only context and fetch original articles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ja-work
          mkdir -p /tmp/ja-work/originals /tmp/ja-work/daily-ja /tmp/ja-work/japanese-ja
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import requests, yaml
          from bs4 import BeautifulSoup

          date = os.environ['TARGET_DATE']

          def frontmatter(path: Path):
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise RuntimeError(f'{path}: no frontmatter')
              end = text.find('\n---\n', 4)
              if end < 0:
                  raise RuntimeError(f'{path}: unterminated frontmatter')
              return yaml.safe_load(text[4:end]) or {}

          daily = frontmatter(Path(f'src/content/daily/{date}.md'))
          lesson = frontmatter(Path(f'src/content/japanese/{date}.md'))
          top = daily.get('top') or []
          if len(top) != 5:
              raise RuntimeError(f'{date}: expected exactly five Top items, got {len(top)}')

          # IMPORTANT: only factual metadata and Japanese-item identity are exported.
          # Chinese summaries, Chinese explanations and Chinese report bodies are deliberately excluded.
          context = {
              'date': date,
              'topics': daily.get('topics') or [],
              'sources': daily.get('sources') or [],
              'featured': bool(daily.get('featured', False)),
              'top': [{
                  'index': i + 1,
                  'title': item.get('title', ''),
                  'source': item.get('source', ''),
                  'topic': item.get('topic', ''),
                  'url': item.get('url', ''),
              } for i, item in enumerate(top)],
              'learning': {
                  'topics': lesson.get('topics') or [],
                  'levels': lesson.get('levels') or [],
                  'vocabularyCount': lesson.get('vocabularyCount', 0),
                  'grammarCount': lesson.get('grammarCount', 0),
                  'vocabulary': [{
                      'term': x.get('term', ''),
                      'reading': x.get('reading', ''),
                      'partOfSpeech': x.get('partOfSpeech', ''),
                      'level': x.get('level', ''),
                      'collocations': x.get('collocations') or [],
                      'exampleJa': x.get('exampleJa', ''),
                  } for x in (lesson.get('vocabulary') or [])],
                  'grammar': [{
                      'pattern': x.get('pattern', ''),
                      'level': x.get('level', ''),
                      'structure': x.get('structure', ''),
                      'exampleJa': x.get('exampleJa', ''),
                  } for x in (lesson.get('grammar') or [])],
                  'technicalTerms': [{
                      'term': x.get('term', ''),
                      **({'japanese': x.get('japanese')} if x.get('japanese') else {}),
                  } for x in (lesson.get('technicalTerms') or [])],
                  'mustRememberWords': lesson.get('mustRememberWords') or [],
                  'mustRememberGrammar': lesson.get('mustRememberGrammar') or [],
              },
          }
          Path('/tmp/ja-work/source-context.json').write_text(
              json.dumps(context, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language': 'ja,en;q=0.8',
          }
          for idx, item in enumerate(top, 1):
              url = item.get('url') or ''
              out = Path(f'/tmp/ja-work/originals/{idx:02d}.txt')
              if not url:
                  out.write_text('FETCH_STATUS: missing URL\n', encoding='utf-8')
                  continue
              try:
                  response = requests.get(url, headers=headers, timeout=30, allow_redirects=True)
                  response.raise_for_status()
                  if not response.encoding or response.encoding.lower() == 'iso-8859-1':
                      response.encoding = response.apparent_encoding or 'utf-8'
                  soup = BeautifulSoup(response.text, 'lxml')
                  for tag in soup(['script','style','noscript','svg','form','nav','footer','header','aside']):
                      tag.decompose()
                  root = soup.find('article') or soup.find('main') or soup.body or soup
                  text = re.sub(r'\n{3,}', '\n\n', root.get_text('\n', strip=True))
                  if len(text) > 70000:
                      text = text[:70000]
                  out.write_text(
                      f'URL: {response.url}\nHTTP_STATUS: {response.status_code}\n'
                      f'SOURCE_TITLE: {item.get("title", "")}\n\n{text}\n',
                      encoding='utf-8'
                  )
                  print(f'{idx}: fetched {len(text)} chars from {response.url}')
              except Exception as exc:
                  out.write_text(
                      f'URL: {url}\nSOURCE_TITLE: {item.get("title", "")}\n'
                      f'FETCH_STATUS: failed\nERROR: {exc}\n', encoding='utf-8'
                  )
                  print(f'::warning::{date} article {idx} fetch failed: {exc}')
          PY

      - name: Generate Japanese directly from original sources in isolated workspace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ja-work
          git init -q
          cat > prompt.txt <<EOF
          You are a senior native Japanese technical editor. Produce two publication-quality Japanese content files for ${TARGET_DATE}.

          YOU ARE IN AN ISOLATED WORKSPACE. The Chinese report bodies are intentionally not available to you.
          Use ONLY:
          - source-context.json: factual Top-5 metadata plus Japanese-learning item identity/skeleton.
          - originals/01.txt through originals/05.txt: text fetched from the original article URLs.

          ABSOLUTE RULE: do not reconstruct Japanese by translating Chinese. Write Japanese directly from the original source material. If an original article is blocked or incomplete, you may retry the URL recorded in source-context.json with shell tools. If it remains inaccessible, stay within verified title/source/topic metadata and explicitly avoid unsupported detail. Never invent facts.

          Create exactly:
          - daily-ja/${TARGET_DATE}.md
          - japanese-ja/${TARGET_DATE}.md

          DAILY-JA
          - Frontmatter keys: title, date, description, topics, sources, top, featured.
          - Keep exactly five Top items. Their title/source/topic/url must be byte-for-byte identical to source-context.json. Write only `why` freshly in natural Japanese.
          - Reuse the authoritative Japanese Top-5 titles exactly; do not paraphrase article titles.
          - Write a complete A+B+C Japanese report with these headings:
            # A. 詳細版
            ## 1. 今日読むべき5本
            ### ① ... through ### ⑤ ...
            ## 2. カテゴリ別サマリー
            ## 3. 面接で使えるポイント
            ## 4. 今日の技術テーマ
            ## 5. 面接復習カード
            # B. 重要ポイントと面接で使える知識
            # C. 日本語学習｜JLPT + IT日本語
          - Each of the five article sections must include 出典, 原文 URL, a faithful Japanese technical summary, and 注目ポイント.
          - A/B/C prose must be idiomatic professional Japanese based on the originals. Prefer terminology used in the original Japanese articles. Preserve standard English product/model/API names.
          - The B section must derive its knowledge points again from the original Top-5 content, not from any translated intermediary.
          - C may briefly point readers to the structured learning cards; do not fabricate a second vocabulary set.

          JAPANESE-JA
          - Preserve learning item identity and order exactly from source-context.json.
          - vocabulary fields: term, reading, partOfSpeech, meaning, level, collocations, note, exampleJa, optional exampleMeaning, optional nuance.
          - grammar fields: pattern, level, meaning, structure, usage, exampleJa, optional exampleMeaning, optional note.
          - technicalTerms fields: term, optional japanese, meaning, context.
          - Keep vocabulary term/reading/partOfSpeech/level/collocations/exampleJa; grammar pattern/level/structure/exampleJa; technical-term identity; mustRememberWords; mustRememberGrammar exactly aligned with source-context.json.
          - Write explanation fields freshly in natural Japanese, using Japanese dictionary-style explanations and the original article context. Do not mechanically translate Chinese explanations.
          - Frontmatter title/description must be natural Japanese. Body should contain only a short Japanese learning introduction because the cards render from frontmatter.

          QUALITY BAR
          - Never output duplicated or damaged Markdown such as ****, ：：, ## ##, repeated bullets, empty ()()() sequences, placeholder tokens, malformed YAML or broken blockquotes.
          - No simplified-Chinese UI labels or Chinese explanatory prose.
          - Do not overuse English where established Japanese technical wording is clearer, but keep standard engineering proper nouns.
          - Before finishing, reread both files and self-edit for natural Japanese, factual drift, unsupported claims, repeated punctuation and malformed Markdown.
          EOF
          copilot --yolo -s --model auto -p "$(cat prompt.txt)"
          test -s "daily-ja/${TARGET_DATE}.md"
          test -s "japanese-ja/${TARGET_DATE}.md"
          cp "daily-ja/${TARGET_DATE}.md" "${GITHUB_WORKSPACE}/src/content/daily-ja/${TARGET_DATE}.md"
          cp "japanese-ja/${TARGET_DATE}.md" "${GITHUB_WORKSPACE}/src/content/japanese-ja/${TARGET_DATE}.md"

      - name: Validate source-direct output and protect Chinese history
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- src/content/daily src/content/japanese
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          import yaml

          date = os.environ['TARGET_DATE']
          zh_daily = Path(f'src/content/daily/{date}.md')
          ja_daily = Path(f'src/content/daily-ja/{date}.md')
          zh_lesson = Path(f'src/content/japanese/{date}.md')
          ja_lesson = Path(f'src/content/japanese-ja/{date}.md')

          for path, min_bytes in ((ja_daily, 7000), (ja_lesson, 7000)):
              if not path.is_file() or path.stat().st_size < min_bytes:
                  raise RuntimeError(f'{path}: missing or unexpectedly short ({path.stat().st_size if path.exists() else 0} bytes)')

          def fm(path):
              text = Path(path).read_text(encoding='utf-8')
              end = text.find('\n---\n', 4)
              if not text.startswith('---\n') or end < 0:
                  raise RuntimeError(f'{path}: malformed frontmatter')
              return yaml.safe_load(text[4:end]) or {}, text

          zd, _ = fm(zh_daily)
          jd, jdt = fm(ja_daily)
          zl, _ = fm(zh_lesson)
          jl, jlt = fm(ja_lesson)

          ztop = zd.get('top') or []
          jtop = jd.get('top') or []
          if len(ztop) != 5 or len(jtop) != 5:
              raise RuntimeError('Top-5 count mismatch')
          for i, (a, b) in enumerate(zip(ztop, jtop), 1):
              for key in ('title','source','topic','url'):
                  if (a.get(key) or '') != (b.get(key) or ''):
                      raise RuntimeError(f'Top {i} {key} mismatch')

          zv, jv = zl.get('vocabulary') or [], jl.get('vocabulary') or []
          zg, jg = zl.get('grammar') or [], jl.get('grammar') or []
          zt, jt = zl.get('technicalTerms') or [], jl.get('technicalTerms') or []
          if (len(zv),len(zg),len(zt)) != (len(jv),len(jg),len(jt)):
              raise RuntimeError('Learning item counts mismatch')
          for i, (a,b) in enumerate(zip(zv,jv), 1):
              for key in ('term','reading','partOfSpeech','level','collocations','exampleJa'):
                  if a.get(key) != b.get(key):
                      raise RuntimeError(f'Vocabulary {i} {key} mismatch')
          for i, (a,b) in enumerate(zip(zg,jg), 1):
              for key in ('pattern','level','structure','exampleJa'):
                  if a.get(key) != b.get(key):
                      raise RuntimeError(f'Grammar {i} {key} mismatch')
          for i, (a,b) in enumerate(zip(zt,jt), 1):
              for key in ('term','japanese'):
                  if a.get(key) != b.get(key):
                      raise RuntimeError(f'Technical term {i} {key} mismatch')
          for key in ('mustRememberWords','mustRememberGrammar'):
              if (zl.get(key) or []) != (jl.get(key) or []):
                  raise RuntimeError(f'{key} mismatch')

          combined = jdt + jlt
          banned = [
              'meaningZh','noteZh','exampleZh','nuanceZh','usageZh','contextZh',
              '详细文字版','今日最值得看的','分类速览','面试复习卡','重点总结','日本語学习',
              'JLPT词汇','专业词汇','JLPT语法','今日必背','为什么值得看','面试问题',
              '约30秒回答','可关联项目','回答要点'
          ]
          hits = [x for x in banned if x in combined]
          if hits:
              raise RuntimeError(f'Chinese labels/schema fields remain: {hits}')

          for pattern in [r'\*\*\*\*', r'：：', r'。。', r'、、', r'(?m)^#{1,6}\s+#{1,6}\s+', r'(?:\(\)){3,}', r'ZXQPH']:
              if re.search(pattern, combined):
                  raise RuntimeError(f'Broken/repeated markup found: {pattern}')

          kana = re.findall(r'[ぁ-んァ-ヴー]', combined)
          if len(kana) < 150:
              raise RuntimeError(f'Japanese-language sanity check failed: only {len(kana)} kana chars')

          print(f'{date}: source-direct Japanese validation passed; kana={len(kana)}')
          PY

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ "$path" != "src/content/daily-ja/${TARGET_DATE}.md" ] && [ "$path" != "src/content/japanese-ja/${TARGET_DATE}.md" ]; then
              echo "::error::Generator changed an unauthorized path: $path"
              exit 1
            fi
          done <<< "$changed"

      - name: Package regenerated date
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${TARGET_DATE}.tgz" \
            "src/content/daily-ja/${TARGET_DATE}.md" \
            "src/content/japanese-ja/${TARGET_DATE}.md"

      - name: Upload regenerated date
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-direct-ja-${{ matrix.date }}
          path: ${{ matrix.date }}.tgz
          retention-days: 1
          if-no-files-found: error

  combine:
    name: combine-validate-and-commit
    needs: regenerate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Download generated dates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: source-direct-ja-*
          path: generated-dates
          merge-multiple: true

      - name: Merge all regenerated Japanese files
        shell: bash
        run: |
          set -euo pipefail
          archive_count="$(find generated-dates -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')"
          echo "Downloaded date archives: ${archive_count}/26"
          test "$archive_count" -eq 26
          for archive in generated-dates/*.tgz; do
            tar -xzf "$archive"
          done
          git diff --exit-code -- src/content/daily src/content/japanese
          changed_count="$(git diff --name-only -- src/content/daily-ja src/content/japanese-ja | wc -l | tr -d ' ')"
          echo "Regenerated Japanese files changed: ${changed_count}"
          test "$changed_count" -eq 52
          if git diff --name-only | grep -Ev '^src/content/(daily-ja|japanese-ja)/2026-(08-(1[2-9]|2[0-9]|3[01])|09-0[1-6])\.md$'; then
            echo '::error::Unexpected paths changed after merging generated content.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build full bilingual site
        run: npm run build

      - name: Commit regenerated Japanese history
        shell: bash
        run: |
          set -euo pipefail
          git add src/content/daily-ja src/content/japanese-ja
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: rebuild historical Japanese mode from original sources'
          git push origin HEAD:repair/japanese-history-from-originals
