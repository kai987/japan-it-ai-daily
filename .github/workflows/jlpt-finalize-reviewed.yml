name: Finalize reviewed JLPT history repair
on:
  push:
    branches: [fix/jlpt-history-dedup-2026-09-18]
    paths: ['.github/workflows/jlpt-finalize-reviewed.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: jlpt-history-repair
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_AUDIO_BASE_URL: ${{ vars.PUBLIC_AUDIO_BASE_URL || 'https://pub-7561025e67be4103ac4bafb331864381.r2.dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve latest main changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Install migration parser
        run: python3 -m pip install PyYAML==6.0.2
      - name: Apply checksum-verified repair if not already committed
        shell: python
        run: |
          import base64,hashlib,io,json,subprocess,tarfile
          from pathlib import Path
          if not Path('docs/jlpt-history/repair-report.json').exists():
              allowed={'docs/jlpt-history/identity-rules.json','docs/jlpt-history/replacement-cards.tsv','docs/jlpt-history/source-attestations.json','scripts/repair-jlpt-history.py','scripts/check-jlpt-history.mjs','scripts/verify-audio-integrity.mjs','src/lib/learningAudio.ts','src/lib/learningAudio.test.ts','src/lib/jlptHistory.test.mjs','src/components/pages/LessonPage.astro','src/components/LessonAudio.astro','package.json'}
              raw=base64.b64decode(''.join(Path(f'docs/jlpt-history/transport-{i:02d}.b64').read_text().strip() for i in range(10)),validate=True)
              assert len(raw)==115240 and hashlib.sha256(raw).hexdigest()=='6640084823544e1856ca108321114566ca8f68dffccb1c09d5219d9c9fe4e387'
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as archive:
                  members=archive.getmembers()
                  assert {m.name for m in members}==allowed and len(members)==len(allowed)
                  assert all(m.isfile() and m.size<2000000 for m in members)
                  for m in members:
                      p=Path(m.name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(archive.extractfile(m).read())
              subprocess.run(['python3','scripts/repair-jlpt-history.py'],check=True)
          report=json.loads(Path('docs/jlpt-history/repair-report.json').read_text())
          assert report['afterCards']==740 and report['historicalDuplicatesAfter']==0
      - name: Preserve reviewed A/B baseline and recording-aware regression assertions
        shell: python
        run: |
          from pathlib import Path
          import hashlib,subprocess
          p=Path('scripts/daily-quality-policy.mjs');policy=p.read_text()
          for language in ['daily','daily-ja']:
              name=f'src/content/{language}/2026-09-07.md'
              before=subprocess.check_output(['git','show',f'28d10dd08b3c70cb6c4773f6b290c344114e6113:{name}'])
              after=Path(name).read_bytes();marker=b'\n# C.'
              assert marker in before and marker in after
              assert before.split(marker)[0]==after.split(marker)[0], 'Reviewed A/B content changed'
              old=hashlib.sha256(before).hexdigest();new=hashlib.sha256(after).hexdigest()
              assert old in policy or new in policy
              policy=policy.replace(old,new)
          p.write_text(policy)
          p=Path('scripts/audio-integrity.test.mjs');s=p.read_text()
          s=s.replace('expect(report.references).toBe(60);', '''const manifest = JSON.parse(readFileSync(join(root, 'public/audio/japanese/2026-09-07/manifest.json'), 'utf8'));
              const recorded = manifest.items.filter((item) => item.playback !== 'browser-tts').length;
              const fallback = manifest.items.filter((item) => item.playback === 'browser-tts').length;
              const interviews = JSON.parse(readFileSync(join(root, 'public/audio/japanese/2026-09-07/interview-manifest.json'), 'utf8'));
              expect(report.references).toBe(recorded * 2 + manifest.grammarItems.length + interviews.items.length);
              expect(report.browserFallbacks).toBe(fallback);
              expect(recorded + fallback).toBe(20);''')
          p.write_text(s)
          p=Path('src/components/pages/LessonPage.astro');s=p.read_text()
          s=s.replace('lesson.vocabulary.map((item, index) =>','lesson.vocabulary.map((item) =>').replace('lesson.grammar.map((item, index) =>','lesson.grammar.map((item) =>')
          p.write_text(s)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run all content, type, unit, audio and build checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/jlpt-final-checks
          failed=0
          for task in check content:integrity:check evidence:check evidence:pilot bilingual:check-interview quality:check audio:check test audio:integrity:check build; do
            if npm run "$task" 2>&1 | tee "/tmp/jlpt-final-checks/${task//:/-}.log"; then echo "PASS $task"; else failed=1; echo "FAIL $task"; fi
          done
          exit "$failed"
      - name: Run browser, security and dependency checks
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:browser 2>&1 | tee /tmp/jlpt-final-checks/browser.log
          npm run security:check 2>&1 | tee /tmp/jlpt-final-checks/security.log
          npm audit --audit-level=high 2>&1 | tee /tmp/jlpt-final-checks/dependency-audit.log
      - name: Commit verified changes and fast-forward main without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('docs/jlpt-history').glob('transport-*.b64'):p.unlink()
          for p in ['.github/workflows/jlpt-history-audit.yml','.github/workflows/jlpt-repair-prepare.yml','.github/workflows/jlpt-repair-draft.yml','.github/workflows/jlpt-extract-final.yml','.github/workflows/jlpt-apply-verified-repair.yml','.github/workflows/jlpt-finalize-reviewed.yml','scripts/jlpt-history-collect.py','scripts/draft-jlpt-repair.py','scripts/jlpt-review-fixes.py','docs/jlpt-history/selections.txt']:
              Path(p).unlink(missing_ok=True)
          PY
          git add docs/jlpt-history scripts src/content src/components/LessonAudio.astro src/components/pages/LessonPage.astro src/lib/learningAudio.ts src/lib/learningAudio.test.ts src/lib/jlptHistory.test.mjs package.json public/audio/japanese .github/workflows
          git diff --cached --stat
          git commit -m 'fix: deduplicate historical JLPT vocabulary with source evidence and strict checks'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:fix/jlpt-history-dedup-2026-09-18
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
          git rev-parse HEAD | tee /tmp/jlpt-final-checks/MAIN_COMMIT.txt
      - name: Dispatch and verify the actual Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          gh workflow run deploy.yml --repo kai987/japan-it-ai-daily --ref main
          RUN=''
          for i in $(seq 1 30); do
            RUN=$(gh run list --repo kai987/japan-it-ai-daily --workflow deploy.yml --commit "$SHA" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$RUN" ] && break
            sleep 5
          done
          test -n "$RUN"
          gh run watch "$RUN" --repo kai987/japan-it-ai-daily --exit-status 2>&1 | tee /tmp/jlpt-final-checks/pages-deploy.log
          gh run view "$RUN" --repo kai987/japan-it-ai-daily --json databaseId,headSha,conclusion,url,jobs > /tmp/jlpt-final-checks/pages-result.json
      - name: Export audit and results
        if: always()
        run: |
          mkdir -p /tmp/jlpt-final-checks
          cp docs/jlpt-history/repair-report.* /tmp/jlpt-final-checks/ 2>/dev/null || true
          git status --short > /tmp/jlpt-final-checks/working-status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jlpt-final-verification
          path: /tmp/jlpt-final-checks
          retention-days: 7
